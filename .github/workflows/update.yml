name: Update Passwall2 & OpenClash

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  clone_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo (fetch all branches)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Clone Passwall2 repo (shallow)
        run: git clone --depth=1 https://github.com/xiaorouji/openwrt-passwall2.git passwall2

      - name: Clone OpenClash repo (shallow)
        run: git clone --depth=1 https://github.com/vernesong/OpenClash.git openclash
        
      - name: Update modemband (shallow)
        run: git clone https://github.com/4IceG/luci-app-modemband.git

      - name: Create or switch to 'luci_app' branch
        run: |
          git fetch origin luci_app || true
          git checkout luci_app || git checkout -b luci_app

      - name: Copy luci-app-passwall2
        run: |
          rm -rf luci-app-passwall2
          cp -r passwall2/luci-app-passwall2 ./luci-app-passwall2

      - name: Copy luci-app-openclash
        run: |
          rm -rf luci-app-openclash
          cp -r openclash/luci-app-openclash ./luci-app-openclash

      - name: Copy Passwall Packages
        run: |
      #   cp -rf packages/* ./

      - name: Cleanup
        run: rm -rf passwall2 openclash

      - name: Commit and push to luci_app
        run: |
          git add .
          git commit -m "Auto update" || echo "No changes to commit"
          git push origin luci_app
